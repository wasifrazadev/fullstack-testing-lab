services:
  node-api:
    build: ./backend-node
    ports:
      - "5000:5000"
    env_file:
      - ./backend-node/.env
    environment:
      PORT: "5000"
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      FRONTEND_ORIGIN: http://localhost:5173

  fastapi-api:
    build: ./backend-fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./backend-fastapi/.env
    environment:
      PORT: "8000"
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      FRONTEND_ORIGIN: http://localhost:5173

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "5173:80"
